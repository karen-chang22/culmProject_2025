{% extends "base.html" %}

{% block content %}
<div class="flex items-start justify-center px-4 pt-10 pb-10 bg-gray-50">

    <div class="max-w-md w-full border-4 border-[#004a99] rounded-[2.5rem] p-10 bg-white shadow-2xl mt-4 mb-4">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='images/wildcat_logo.png') }}" class="h-20 mx-auto mb-4" alt="Logo">
            <h2 class="text-3xl font-bold text-[#004a99]">Admin Portal</h2>
            <p class="text-gray-500 mt-2">Please sign in to continue</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 px-2">Username</label>
                <input type="text" name="user_id" required
                    class="w-full p-4 border-2 border-gray-200 rounded-2xl focus:border-[#5bc2f2] focus:outline-none transition-all"
                    placeholder="Enter your username">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 px-2">Password</label>
                <input type="password" name="password" required
                    class="w-full p-4 border-2 border-gray-200 rounded-2xl focus:border-[#5bc2f2] focus:outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-[#004a99] text-white py-4 rounded-2xl font-bold text-lg hover:bg-[#5bc2f2] transform hover:scale-[1.02] transition-all shadow-lg">
                Sign In
            </button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="mt-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg text-sm">
                {{ messages[0] }}
            </div>
            {% endif %}
        {% endwith %}

        {% if error %}
        <div class="mt-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
