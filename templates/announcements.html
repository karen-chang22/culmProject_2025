{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-10">
    
    <div class="mb-4">
        <p id="current-date-display" class="text-2xl font-bold text-gray-500 italic"></p>
    </div>

    <h2 class="text-4xl font-bold text-[#004a99] mb-8 border-b-4 border-[#5bc2f2] inline-block pb-2">
        Daily Announcements
    </h2>

    <div class="border-4 border-[#004a99] rounded-[2.5rem] p-10 bg-white shadow-lg mb-10">
        <div class="prose prose-xl max-w-none text-gray-800 leading-relaxed">
            {% if daily_msg %}
                {{ daily_msg }}
            {% else %}
                <p class="italic text-gray-500">No announcements for today.</p>
            {% endif %}
        </div>
    </div>

    {% if session.get('role') == 'admin' or session['role'] == 'teacher'%}
    <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-[2rem] p-8">
        <h3 class="text-xl font-bold mb-4 text-[#004a99]">Update Announcement</h3>
        <form action="/update_announcements" method="POST">
            <textarea 
                name="new_content" 
                rows="4" 
                class="w-full p-4 border-2 border-gray-200 rounded-2xl focus:border-[#5bc2f2] focus:outline-none mb-4"
                placeholder="Type the new daily message here...">{{ daily_msg }}</textarea>
            <button type="submit" class="bg-[#004a99] text-white px-8 py-3 rounded-full font-bold hover:bg-[#5bc2f2] transition-all">
                Update Daily Board
            </button>
        </form>
    </div>
    {% endif %}
</div>

<script>
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const today = new Date().toLocaleDateString('en-US', options);
    document.getElementById('current-date-display').innerText = today;
</script>
{% endblock %}
